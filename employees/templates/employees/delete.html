<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Employee</title>
</head>

<body style="
    margin:0;
    padding:0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
">

<div style="
    background:white;
    width:420px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
    text-align:center;
">

    <!-- HEADER -->
    <h2 style="margin-bottom:10px; color:#333;">Delete Employee</h2>
    <p style="color:#777; font-size:14px;">This action cannot be undone</p>

    <!-- WARNING -->
    <div style="
        margin:20px 0;
        padding:15px;
        background:#ffe5e5;
        border-radius:10px;
        color:#d63031;
        font-weight:bold;
    ">
        ⚠️ Are you sure you want to delete <br><br>
        <span style="font-size:18px;">{{ employee.name }}</span> ?
    </div>

    <!-- FORM -->
    <form method="POST">
        {% csrf_token %}

        <button type="submit"
        style="
            width:100%;
            padding:12px;
            background:linear-gradient(135deg, #ff4b2b, #ff416c);
            border:none;
            border-radius:10px;
            color:white;
            font-weight:bold;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        "
        onmouseover="this.style.opacity='0.85'"
        onmouseout="this.style.opacity='1'"
        >
            🗑️ Yes, Delete
        </button>

    </form>

    <!-- CANCEL -->
    <div style="margin-top:15px;">
        <a href="/" style="
            text-decoration:none;
            color:#555;
            font-size:14px;
        ">
            Cancel
        </a>
    </div>

</div>

</body>
</html>
