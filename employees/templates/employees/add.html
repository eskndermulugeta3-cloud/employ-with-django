<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
</head>

<body style="
    margin:0;
    padding:0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
">

<div style="
    background:white;
    width:420px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
">

    <!-- HEADER -->
    <div style="text-align:center; margin-bottom:25px;">
        <h2 style="margin:0; color:#333;">Add New Employee</h2>
        <p style="color:#777; font-size:14px;">Fill details to create a new record</p>
    </div>

    <!-- FORM -->
    <form method="POST">
        {% csrf_token %}

        <!-- NAME -->
        <label style="font-weight:600;">Full Name</label>
        <input type="text" name="name" required
        style="
            width:100%;
            padding:10px;
            margin:8px 0 15px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
        ">

        <!-- EMAIL -->
        <label style="font-weight:600;">Email Address</label>
        <input type="email" name="email" required
        style="
            width:100%;
            padding:10px;
            margin:8px 0 15px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
        ">

        <!-- POSITION -->
        <label style="font-weight:600;">Position</label>
        <input type="text" name="position" required
        style="
            width:100%;
            padding:10px;
            margin:8px 0 20px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
        ">

        <!-- BUTTON -->
        <button type="submit"
        style="
            width:100%;
            padding:12px;
            background:linear-gradient(135deg, #43e97b, #38f9d7);
            border:none;
            border-radius:10px;
            color:white;
            font-weight:bold;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        "
        onmouseover="this.style.opacity='0.85'"
        onmouseout="this.style.opacity='1'"
        >
            + Add Employee
        </button>

    </form>

    <!-- BACK BUTTON -->
    <div style="text-align:center; margin-top:20px;">
        <a href="/" style="
            text-decoration:none;
            color:#667eea;
            font-size:14px;
        ">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
