<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Employee</title>
</head>

<body style="
    margin:0;
    padding:0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
">

<div style="
    background:white;
    width:420px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
">

    <!-- HEADER -->
    <div style="text-align:center; margin-bottom:25px;">
        <h2 style="margin:0; color:#333;">Update Employee</h2>
        <p style="color:#777; font-size:14px;">Modify employee details</p>
    </div>

    <!-- FORM -->
    <form method="POST">
        {% csrf_token %}

        <!-- NAME -->
        <label style="font-weight:600;">Full Name</label>
        <input type="text" name="name" value="{{ form.instance.name }}" required
        style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:8px;">

        <!-- EMAIL -->
        <label style="font-weight:600;">Email Address</label>
        <input type="email" name="email" value="{{ form.instance.email }}" required
        style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:8px;">

        <!-- POSITION -->
        <label style="font-weight:600;">Position</label>
        <input type="text" name="position" value="{{ form.instance.position }}" required
        style="width:100%; padding:10px; margin:8px 0 20px; border:1px solid #ccc; border-radius:8px;">

        <!-- BUTTON -->
        <button type="submit"
        style="
            width:100%;
            padding:12px;
            background:linear-gradient(135deg, #2193b0, #6dd5ed);
            border:none;
            border-radius:10px;
            color:white;
            font-weight:bold;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        "
        onmouseover="this.style.opacity='0.85'"
        onmouseout="this.style.opacity='1'"
        >
            ✏️ Update Employee
        </button>

    </form>

    <!-- BACK -->
    <div style="text-align:center; margin-top:20px;">
        <a href="/" style="text-decoration:none; color:#4facfe; font-size:14px;">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
