<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>

<body style="margin:0; font-family:Segoe UI; background:#f4f6f9;">

<div style="display:flex; height:100vh;">

    <!-- SIDEBAR -->
    <div style="
        width:220px;
        background:#1e293b;
        color:white;
        padding:20px;
    ">
        <h2>EMS</h2>
        <hr style="border:1px solid #334155;">

        <p><a href="/" style="color:white; text-decoration:none;">🏠 Dashboard</a></p>
        <p><a href="/add/" style="color:white; text-decoration:none;">➕ Add Employee</a></p>
        <p><a href="/logout/" style="color:#f87171; text-decoration:none;">🚪 Logout</a></p>
    </div>

    <!-- MAIN CONTENT -->
    <div style="flex:1; padding:30px;">

        <h2>Welcome to Employee Dashboard</h2>

        <!-- STATS CARDS -->
        <div style="display:flex; gap:20px; margin-top:20px;">

            <div style="background:white; padding:20px; border-radius:10px; flex:1;">
                <h3>Total Employees</h3>
                <p style="font-size:28px; font-weight:bold;">
                    {{ employees|length }}
                </p>
            </div>

            <div style="background:white; padding:20px; border-radius:10px; flex:1;">
                <h3>System Status</h3>
                <p style="color:green;">Active ✅</p>
            </div>

        </div>

        <!-- TABLE -->
        <div style="margin-top:30px; background:white; padding:20px; border-radius:10px;">
            <h3>Employees</h3>

            <table style="width:100%; border-collapse:collapse; margin-top:15px;">
                <tr style="background:#f1f5f9;">
                    <th style="padding:10px;">Name</th>
                    <th>Email</th>
                    <th>Position</th>
                    <th>Actions</th>
                </tr>

                {% for emp in employees %}
                <tr style="border-top:1px solid #ddd;">
                    <td style="padding:10px;">{{ emp.name }}</td>
                    <td>{{ emp.email }}</td>
                    <td>{{ emp.position }}</td>
                    <td>
                        <a href="/update/{{ emp.id }}/" style="color:#3b82f6;">Edit</a> |
                        <a href="/delete/{{ emp.id }}/" style="color:#ef4444;">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </table>

        </div>

    </div>
</div>

</body>
</html>
